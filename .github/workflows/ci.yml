name: CI

on:
  push:
  pull_request:

jobs:
  package-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=PeripheralControlCenter-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralControlCenter-source
          path: PeripheralControlCenter-source.zip
          retention-days: 30

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconsole --onefile --collect-submodules bleak --collect-submodules winrt --name PeripheralControlCenter battery_tray.py
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralControlCenter-exe
          path: dist/PeripheralControlCenter.exe
